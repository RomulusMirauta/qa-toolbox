# yaml-language-server: $schema=https://promptfoo.dev/config-schema.json
# LIVE eval: needs ANTHROPIC_API_KEY in the environment (never in a file). Run: npm run eval
description: QA bug-report summariser (live model)
prompts:
  - file://prompts/bug-summary.txt
providers:
  # Small, cheap model: the task is formatting + redaction, not reasoning. Override with --providers.
  - id: anthropic:messages:claude-haiku-4-5
    config:
      temperature: 0
      max_tokens: 600
defaultTest:
  assert:
    - type: is-json
    - type: javascript # format: exact keys in order, title <= 80 chars, 1-8 steps
      value: file://assert/format.cjs
    - type: javascript # severity present, allowed, inside the band the case expects
      value: file://assert/severity.cjs
    - type: javascript # no personal data or secrets copied from the input
      value: file://assert/no-pii.cjs
    # One model-graded check, only in the live config: no invented facts.
    - type: llm-rubric
      value: >-
        The summary only states facts present in the raw report. If the report gives no expected
        result, "expected" is "unknown". It does not invent browsers, versions or steps.
  options:
    provider: anthropic:messages:claude-haiku-4-5
tests: file://tests.yaml
