name: Playwright Test Agents (toolchain)

on:
  push:
    paths: ['test-agents/**', '.github/workflows/test-agents.yml']
  pull_request:
    paths: ['test-agents/**', '.github/workflows/test-agents.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  toolchain:
    # No LLM runs in CI: this checks that the agents' tool layer (the Playwright Test MCP server)
    # starts and that the seed + generated tests pass against the public site.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: test-agents
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: test-agents/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: MCP server answers and lists the agent tools
        run: node probe-mcp.mjs
      - name: Seed and generated tests
        run: npx playwright test
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-agents-report
          path: test-agents/playwright-report/
          retention-days: 14
