name: Playwright suite in Docker

on:
  push:
    paths: ['docker/**', '.github/workflows/docker.yml']
  pull_request:
    paths: ['docker/**', '.github/workflows/docker.yml']
  workflow_dispatch:
    inputs:
      test_args:
        description: Extra Playwright arguments (empty = the whole suite)
        default: '--grep "@smoke|@critical"'
      suite_ref:
        description: Branch, tag or commit of the public suite
        default: main

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run the suite in the official Playwright image
        env:
          # Push/PR: the fast tier. Manual runs choose.
          TEST_ARGS: ${{ github.event_name == 'workflow_dispatch' && inputs.test_args || '--grep "@smoke|@critical"' }}
          SUITE_REF: ${{ inputs.suite_ref || 'main' }}
        run: |
          mkdir -p docker/out && chmod a+rwx docker/out
          docker compose -f docker/compose.yaml run --rm tests
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: docker/out/
          retention-days: 14
