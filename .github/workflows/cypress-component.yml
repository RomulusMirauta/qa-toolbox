name: Cypress component tests

on:
  push:
    paths: ['cypress-component/**', '.github/workflows/cypress-component.yml']
  pull_request:
    paths: ['cypress-component/**', '.github/workflows/cypress-component.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cypress-component-${{ github.ref }}
  cancel-in-progress: true

jobs:
  component:
    # Mounts the React components in a real browser (Cypress's bundled Electron, headless) through
    # the Vite dev server. No target app and no secrets: everything runs inside the runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cypress-component
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cypress-component/package-lock.json
      - run: npm ci --no-fund
      - name: Install and verify the Cypress binary
        # npm ci normally downloads it in a postinstall script; this is a no-op then, and a safety net when
        # install scripts are disabled.
        run: npx cypress install && npx cypress verify
      - name: Component tests (headless; writes the pass/fail table to the job summary)
        run: npm run --silent test:summary
      - name: Upload screenshots and videos on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypress-component-failures
          path: |
            cypress-component/out/screenshots/
            cypress-component/out/videos/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload the summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cypress-component-summary
          path: cypress-component/out/summary.md
          if-no-files-found: ignore
          retention-days: 14
